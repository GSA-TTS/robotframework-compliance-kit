# gitleaks configuration for gsa-compliance-robot.
#
# Mirrors the conservative approach used by GSA-TTS/M-26-14 and
# GSA-TTS/gsa-pages: extend the default gitleaks ruleset and allowlist
# specific known-false-positive paths/strings rather than disabling rules
# wholesale.

[extend]
useDefault = true

[allowlist]
description = "Known false positives in test fixtures"
regexes = [
  # tests/test_redaction.py intentionally embeds a syntactically-valid but
  # semantically-empty JWT (header {"alg":"HS256"}, payload {"sub":"1234567890"})
  # to exercise RedactionListener's JWT-masking pattern. It is not a real
  # token issued by any system.
  '''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U''',
]
paths = [
  '''(^|/)\.venv/''',
  '''(^|/)__pycache__/''',
  '''uv\.lock''',
  '''(^|/)\.pytest_cache/''',
  '''(^|/)\.robotcode_cache/''',
  '''(^|/)\.robocop_cache/''',
]
