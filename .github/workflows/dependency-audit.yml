name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies (all extras, so lockfile-resolved transitive deps are audited too)
        run: uv sync --extra dev --extra browser --extra allure --extra cloudgov --extra cloudlogs-aws --extra cloudlogs-azure --extra cloudlogs-gcp
      - name: Run pip-audit
        run: uvx pip-audit --local
