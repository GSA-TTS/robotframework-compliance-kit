name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run pytest with coverage
        run: uv run pytest --cov=gsa_compliance_robot --cov-report=term-missing --cov-report=xml

  robocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run robocop
        run: uv run robocop check --config robocop.toml src/

  robotcode-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --extra dev --extra browser --extra allure
      - name: Run robotcode analyze
        run: uv run robotcode analyze code --exit-code-mask hint src/gsa_compliance_robot/resources/
